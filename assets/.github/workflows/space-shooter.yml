name: Update pink space shooter

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needed to amend yesterday's game commit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gh-space-shooter
        run: pip install gh-space-shooter==2.0.5

      - name: Generate pink game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/pink_space_shooter.py ${{ github.repository_owner }} \
            --output game.gif --strategy random --fps 30

      # Reuse one commit instead of adding a new one every day,
      # so the repo doesn't fill up with old GIFs.
      - name: Commit game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game.gif
          git diff --staged --quiet && exit 0
          MSG="Update space shooter game"
          if [ "$(git log -1 --pretty=%s)" = "$MSG" ] && \
             [ "$(git log -1 --name-only --pretty=format: | grep -v '^$')" = "game.gif" ]; then
            git commit --amend --no-edit
            git push --force-with-lease
          else
            git commit -m "$MSG"
            git push
          fi
